<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Higurashi Batch Filter – Web Version</title>
<style>
  body { font-family: system-ui, sans-serif; background:#111; color:#eee; margin:0; padding:20px; }
  h1 { font-size:1.4rem; margin-bottom:10px; }
  .layout { display:grid; grid-template-columns: 1fr 1fr; gap:20px; }
  canvas { width:100%; background:#000; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.6); }
  .controls { margin-top:20px; display:grid; grid-template-columns: repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
  .control { background:#1a1a1a; padding:12px; border-radius:12px; }
  label { display:flex; justify-content:space-between; font-size:.85rem; margin-bottom:4px; align-items:center; }
  input[type=range] { width:100%; }
  input[type=checkbox] { transform:scale(1.2); }
  .file-input { margin-bottom:15px; }
  button { padding:8px 12px; border-radius:8px; border:none; background:#333; color:#fff; cursor:pointer; }
</style>
</head>
<body>
<h1>Higurashi-Style Image Processor (Accurate Web Replica)</h1>
<input type="file" class="file-input" accept="image/*" />
<button id="downloadBtn">Download Processed Image</button>
<div class="layout">
  <div><h3>Original</h3><canvas id="originalCanvas"></canvas></div>
  <div><h3>Preview</h3><canvas id="previewCanvas"></canvas></div>
</div>
<div class="controls" id="controls"></div><script>
const originalCanvas = document.getElementById('originalCanvas');
const previewCanvas = document.getElementById('previewCanvas');
const oCtx = originalCanvas.getContext('2d');
const pCtx = previewCanvas.getContext('2d');
const controlsDiv = document.getElementById('controls');

let img = new Image();
let originalPixels = null;

const settings = {
  edgeInvert:true,
  edgeMethod:'sobel',
  levels:true, black:15, white:85,
  unsharp:true, unsharpAmount:1,
  motionBlur:true, blurRadius:10, blurAngle:-25, blurOpacity:0.7,
  posterize:true, posterizeLevels:9,
  edges:true, edgeThreshold:80, edgeOpacity:0.5,
  // New preprocessing controls
  aspectMode:'4:3', // '4:3', '16:9', '1:1', 'original'
  maxHeight:1080
};

function addSlider(key,label,min,max,step=1){
  const w=document.createElement('div'); w.className='control';
  const l=document.createElement('label'); l.innerHTML=`${label}<span id='${key}Val'></span>`;
  const i=document.createElement('input'); i.type='range'; i.min=min; i.max=max; i.step=step; i.value=settings[key];
  i.oninput=()=>{settings[key]=parseFloat(i.value);document.getElementById(key+'Val').textContent=i.value;process();};
  w.appendChild(l); w.appendChild(i); controlsDiv.appendChild(w);
  document.getElementById(key+'Val').textContent=i.value;
}
function addToggle(key,label){
  const w=document.createElement('div'); w.className='control';
  const l=document.createElement('label'); l.textContent=label;
  const i=document.createElement('input'); i.type='checkbox'; i.checked=settings[key];
  i.onchange=()=>{settings[key]=i.checked;process();};
  l.appendChild(i); w.appendChild(l); controlsDiv.appendChild(w);
}

addToggle('levels','Levels'); addSlider('black','Black %',0,50); addSlider('white','White %',50,100);
addToggle('unsharp','Unsharp Mask'); addSlider('unsharpAmount','Unsharp Amount',0,3,0.1);
addToggle('motionBlur','Motion Blur Layer'); addSlider('blurRadius','Blur Radius',0,30); addSlider('blurAngle','Blur Angle',-90,90); addSlider('blurOpacity','Blur Layer Opacity',0,1,0.05);
addToggle('posterize','Posterize'); addSlider('posterizeLevels','Posterize Levels',2,20);
addToggle('edges','Edge Multiply Overlay');
addToggle('edgeInvert','Invert Edge Mask (Multiply Default)');

// Edge detection method selector
const edgeMethodWrapper=document.createElement('div');edgeMethodWrapper.className='control';
const edgeLabel=document.createElement('label');edgeLabel.textContent='Edge Algorithm';
const edgeSelect=document.createElement('select');edgeSelect.innerHTML=`
  <option value="sobel">Sobel</option>
  <option value="prewitt">Prewitt</option>
  <option value="laplacian">Laplacian</option>
  <option value="roberts">Roberts Cross</option>`;
edgeSelect.onchange=()=>{settings.edgeMethod=edgeSelect.value;process();};
edgeLabel.appendChild(edgeSelect);edgeMethodWrapper.appendChild(edgeLabel);controlsDiv.appendChild(edgeMethodWrapper); addSlider('edgeThreshold','Edge Threshold',0,255); addSlider('edgeOpacity','Edge Opacity',0,1,0.05);

// Aspect ratio selector
const aspectWrapper=document.createElement('div');aspectWrapper.className='control';
const aspectLabel=document.createElement('label');aspectLabel.textContent='Aspect Ratio';
const aspectSelect=document.createElement('select');aspectSelect.innerHTML=`
  <option value="4:3">4:3</option>
  <option value="16:9">16:9</option>
  <option value="1:1">1:1</option>
  <option value="original">Keep Original</option>`;
aspectSelect.value=settings.aspectMode;
aspectSelect.onchange=()=>{settings.aspectMode=aspectSelect.value;process();};
aspectLabel.appendChild(aspectSelect);aspectWrapper.appendChild(aspectLabel);controlsDiv.appendChild(aspectWrapper);

// Max height slider
addSlider('maxHeight','Max Height',0,2160,10);

function clamp(v){return Math.max(0,Math.min(255,v));}

function applyLevels(d){const b=settings.black/100*255,w=settings.white/100*255,s=255/(w-b);for(let i=0;i<d.length;i+=4){for(let c=0;c<3;c++)d[i+c]=clamp((d[i+c]-b)*s);}}

function boxBlur(src,w,h,radius,angle){const out=new Uint8ClampedArray(src.length);const rad=Math.max(1,radius|0);const ang=angle*Math.PI/180;const dx=Math.cos(ang),dy=Math.sin(ang);
for(let y=0;y<h;y++)for(let x=0;x<w;x++){
 let r=0,g=0,b=0,cnt=0;
 for(let k=-rad;k<=rad;k++){
  const xx=Math.round(x+dx*k),yy=Math.round(y+dy*k);
  if(xx>=0&&xx<w&&yy>=0&&yy<h){const i=(yy*w+xx)*4;r+=src[i];g+=src[i+1];b+=src[i+2];cnt++;}
 }
 const o=(y*w+x)*4;out[o]=r/cnt;out[o+1]=g/cnt;out[o+2]=b/cnt;out[o+3]=255;
}
return out;}

function unsharpMask(data,w,h,amount){const blur=boxBlur(data,w,h,2,0);for(let i=0;i<data.length;i+=4){for(let c=0;c<3;c++){data[i+c]=clamp(data[i+c]+amount*(data[i+c]-blur[i+c]));}}}

function posterize(d){const levels=settings.posterizeLevels,step=255/(levels-1);for(let i=0;i<d.length;i+=4){for(let c=0;c<3;c++)d[i+c]=Math.round(d[i+c]/step)*step;}}

function sobel(gray,w,h){const o=new Uint8ClampedArray(gray.length);const gx=[-1,0,1,-2,0,2,-1,0,1],gy=[-1,-2,-1,0,0,0,1,2,1];for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){let sx=0,sy=0,k=0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const v=gray[(y+j)*w+(x+i)];sx+=v*gx[k];sy+=v*gy[k];k++;}o[y*w+x]=Math.sqrt(sx*sx+sy*sy);}return o;}

function prewitt(gray,w,h){const o=new Uint8ClampedArray(gray.length);const gx=[-1,0,1,-1,0,1,-1,0,1],gy=[-1,-1,-1,0,0,0,1,1,1];for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){let sx=0,sy=0,k=0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const v=gray[(y+j)*w+(x+i)];sx+=v*gx[k];sy+=v*gy[k];k++;}o[y*w+x]=Math.sqrt(sx*sx+sy*sy);}return o;}

function laplacian(gray,w,h){const o=new Uint8ClampedArray(gray.length);const k=[0,1,0,1,-4,1,0,1,0];for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){let sum=0,idx=0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){sum+=gray[(y+j)*w+(x+i)]*k[idx++];}o[y*w+x]=Math.abs(sum);}return o;}

function roberts(gray,w,h){const o=new Uint8ClampedArray(gray.length);for(let y=0;y<h-1;y++)for(let x=0;x<w-1;x++){const i=y*w+x;const gx=gray[i]-gray[i+w+1];const gy=gray[i+1]-gray[i+w];o[i]=Math.sqrt(gx*gx+gy*gy);}return o;}

function multiplyBlend(base,blend,opacity){for(let i=0;i<base.length;i+=4){for(let c=0;c<3;c++){const b=base[i+c]/255, l=blend[i+c]/255;base[i+c]=clamp(255*(b*(1-opacity)+b*l*opacity));}}}

function process(){if(!originalPixels)return;const w=previewCanvas.width,h=previewCanvas.height;
let base=new Uint8ClampedArray(originalPixels);
if(settings.levels)applyLevels(base);
if(settings.unsharp)unsharpMask(base,w,h,settings.unsharpAmount);
let sharpCopy=new Uint8ClampedArray(base);

if(settings.motionBlur){const blur=boxBlur(sharpCopy,w,h,settings.blurRadius,settings.blurAngle);for(let i=0;i<base.length;i+=4){for(let c=0;c<3;c++)base[i+c]=clamp(base[i+c]*(1-settings.blurOpacity)+blur[i+c]*settings.blurOpacity);}}

if(settings.posterize)posterize(base);

if(settings.edges){const gray=new Uint8ClampedArray(w*h);for(let i=0,j=0;i<originalPixels.length;i+=4,j++)gray[j]=originalPixels[i]*0.3+originalPixels[i+1]*0.59+originalPixels[i+2]*0.11;
let edge;
switch(settings.edgeMethod){
  case 'prewitt': edge=prewitt(gray,w,h); break;
  case 'laplacian': edge=laplacian(gray,w,h); break;
  case 'roberts': edge=roberts(gray,w,h); break;
  default: edge=sobel(gray,w,h);
}

// Threshold after detection
for(let i=0;i<edge.length;i++) edge[i]=edge[i]>settings.edgeThreshold?255:0;

// Invert so edges are dark lines for multiply (default behavior)
if(settings.edgeInvert){
  for(let i=0;i<edge.length;i++) edge[i]=255-edge[i];
}const edgeImg=new Uint8ClampedArray(base.length);for(let i=0,j=0;i<edgeImg.length;i+=4,j++){edgeImg[i]=edgeImg[i+1]=edgeImg[i+2]=edge[j];edgeImg[i+3]=255;}
multiplyBlend(base,edgeImg,settings.edgeOpacity);}

pCtx.putImageData(new ImageData(base,w,h),0,0);
}

document.querySelector('input[type=file]').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{img.onload=()=>{
  // --- Determine crop based on aspect mode ---
  let srcW = img.width;
  let srcH = img.height;
  let cropW = srcW;
  let cropH = srcH;
  let cropX = 0;
  let cropY = 0;

  if (settings.aspectMode !== 'original') {
    let targetRatio = 4/3;
    if (settings.aspectMode === '16:9') targetRatio = 16/9;
    if (settings.aspectMode === '1:1') targetRatio = 1;

    if (srcW/srcH > targetRatio) {
      cropW = Math.round(srcH * targetRatio);
      cropH = srcH;
    } else if (srcW/srcH < targetRatio) {
      cropW = srcW;
      cropH = Math.round(srcW / targetRatio);
    }

    cropX = Math.floor((srcW - cropW) / 2);
    cropY = Math.floor((srcH - cropH) / 2);
  }

  // --- Scale down if taller than maxHeight (if >0) ---
  let finalW = cropW;
  let finalH = cropH;
  if (settings.maxHeight > 0 && finalH > settings.maxHeight) {
    const scale = settings.maxHeight / finalH;
    finalH = Math.round(settings.maxHeight);
    finalW = Math.round(finalW * scale);
  }

  originalCanvas.width = previewCanvas.width = finalW;
  originalCanvas.height = previewCanvas.height = finalH;

  // Draw cropped + scaled
  oCtx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, finalW, finalH);

  const d = oCtx.getImageData(0, 0, finalW, finalH);
  originalPixels = new Uint8ClampedArray(d.data);
  process();
};img.src=ev.target.result;};r.readAsDataURL(f);});

document.getElementById('downloadBtn').onclick=()=>{const a=document.createElement('a');a.href=previewCanvas.toDataURL('image/png');a.download='higurashi_style.png';a.click();};
</script></body>
</html>
